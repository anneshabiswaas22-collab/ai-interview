name: Pinned Euron foundation audit

on:
  pull_request:
    paths:
      - .github/workflows/euron-audit.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: euron

jobs:
  source-checks:
    name: Build and upstream unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: euron-sde-team/euron-open-real-time-ai-conversation-system
          ref: 216a8fc52a055587f436f2446f1a80b6868bd14a
          path: euron
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: euron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm openapi --check
      - run: scripts/check-sanitization.sh

  integration:
    name: Upstream integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.12-alpine
        env:
          POSTGRES_USER: conv
          POSTGRES_PASSWORD: conv
          POSTGRES_DB: conv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conv -d conv"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://conv:conv@localhost:5432/conv_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: euron-sde-team/euron-open-real-time-ai-conversation-system
          ref: 216a8fc52a055587f436f2446f1a80b6868bd14a
          path: euron
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: euron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  browser-demo:
    name: Offline browser demo
    needs: [source-checks, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: euron-sde-team/euron-open-real-time-ai-conversation-system
          ref: 216a8fc52a055587f436f2446f1a80b6868bd14a
          path: euron
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: euron/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make up
      - run: make demo
      - run: pnpm e2e
      - name: Collect stack logs on failure
        if: failure()
        run: docker compose -p open-conversation logs --tail 100 api worker web migrate stubs terraform
