name: Interview core unit tests

on:
  push:
    branches: [main, feat/bootstrap-interview-core]
    paths:
      - "packages/interview-core/**"
      - ".github/workflows/interview-core.yml"
  pull_request:
    paths:
      - "packages/interview-core/**"
      - ".github/workflows/interview-core.yml"

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit test pure interview domain
        run: node --test packages/interview-core/test/*.test.mjs
