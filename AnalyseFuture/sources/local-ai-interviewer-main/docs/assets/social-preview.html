<!doctype html>

<html lang="en">
<head>

<title>Local AI Interviewer social preview</title>
<style>

  .left { padding: 72px 0 64px 76px; display: flex; flex-direction: column; }

  h1 span { color: var(--accent); }
  p.lead { margin-top: 22px; font-size: 22px; line-height: 1.45; color: var(--muted); max-width: 470px; }
  ul { list-style: none; padding: 0; margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px; }

</head>

  <div class="wrap">
    <div class="left">
      <div class="brand"><img src="../../frontend/public/logo.svg" alt="">Local AI Interviewer</div>
      <h1>Mock interviews,<br><span>graded on your machine.</span></h1>
      <p class="lead">Spoken or typed answers, evidence-checked feedback and adaptive follow-ups from a local model. No cloud by default.</p>
      <ul><li>Ollama</li><li>FastAPI</li><li>React + TypeScript</li><li>SQLite</li></ul>
    </div>
    <div class="right"><div class="frame"><img src="screenshots/report.png" alt=""></div></div>
  </div>
</body>
</html>
