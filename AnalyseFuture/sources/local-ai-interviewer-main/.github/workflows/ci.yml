# Checks every pull request and every push to main. Ollama is mocked in the backend tests, so no model is ever downloaded
# and nothing needs a GPU, a microphone or a cloud account.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels its run in progress (no duplicate work).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}     # never cancel runs on main (every commit keeps a status)

permissions:
  contents: read

jobs:
  lint:
    name: Lint, docs and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the pinned Python dev tools (the versions in backend/requirements-dev.txt)
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Python lint (ruff, bug-finding rules)
        run: python -m ruff check --output-format=github .
      - name: Markdown links, images and anchors
        run: python scripts/check_docs.py
      - name: Frontend lint (ESLint, no warnings allowed)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  backend:
    name: Backend tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest      # the oldest Python the README promises
            python: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest backend -q -ra --cov=backend/app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend typecheck, tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  launcher-smoke:
    name: Launcher smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `check` is read-only. On a runner without Ollama it reports the missing pieces and exits 1 (0 if nothing blocking is
      # missing). Anything else - a Python traceback, another exit code, or a report that never reaches the Ollama line - fails.
      - name: manage.py check runs on this OS
        shell: bash
        run: |
          set +e
          out=$(python scripts/manage.py check 2>&1); code=$?
          set -e
          echo "$out"
          echo "exit code: $code"
          if echo "$out" | grep -q "Traceback"; then echo "::error::manage.py check crashed"; exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then echo "::error::unexpected exit code $code"; exit 1; fi
          echo "$out" | grep -q "Ollama" || { echo "::error::the report never reached the Ollama check"; exit 1; }
